# monitor-apache.conf — Apache-Main-Config der dedizierten Panel-Instance
#
# Wird von andora-monitor-apache.service geladen: apache2 -f <diese Datei>.
# Diese Instance verändert den globalen system eigenen apache2 NICHT.
# Dies ist eine Vorlage — ServerRoot, User, Logs auf den Zielserver anpassen.
#
# Die Bind-Host-/Dual-Stack-Direktiven (Listen) stehen getrennt in
# andora-monitor-site.conf, damit sich der Bind-Modus unabhängig ändern lässt.

ServerRoot /etc/apache2
PidFile /run/andora-monitor/apache2.pid
ErrorLog /var/log/andora-monitor/apache-error.log
LogLevel warn

# User/Group muss zu den systemd-Units passen.
# (Die eigentliche Ausführung übernimmt der systemd-User; hier nur Dokumentation.)
User pi
Group pi

# Benötigte Module laden (Deployment-Host: Paket apache2 + libapache2-mod-fcgid
# oder mod_proxy_fcgi; hier explizit protokolliert).
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule env_module /usr/lib/apache2/modules/mod_env.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_fcgi_module /usr/lib/apache2/modules/mod_proxy_fcgi.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so

# Site-/Vhost-Konfiguration (enthält Listen + VirtualHost + PHP-Handler).
Include /opt/andora/monitor/andora-monitor-site.conf
