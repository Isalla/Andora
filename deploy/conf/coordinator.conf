# coordinator.conf — EnvironmentFile / Konfigurationsvorbild des
# andora-coordinator.service (Deployment). Werte auf den Zielserver
# anpassen; die kommentierte Stichwortliste deckt sich mit
# src/coordinator/config.env.example.
#
# Details & Volles Schema: docs/Coordinator.md und src/coordinator/README.md.
# Probe der Stanzeistung vor Ort:
#   curl -s http://127.0.0.1:8082/health
#   curl -s http://127.0.0.1:8082/status

COORDINATOR_PORT=8082
COORDINATOR_BIND_HOST=
COORDINATOR_DATA_DIR=/opt/andora/coordinator/data
# Sprachfilterdateien (<lang>.input.txt / <lang>.output.txt) werden beim
# Start geladen; alle Sprachen gelten gemeinsam für ALLE Jobs.
COORDINATOR_FILTER_DIR=/opt/andora/coordinator/filters

# Einzige KI-Schnittstelle; der Coordinator hält KEINE DB-Credentials.
OLLAMA_URL=
OLLAMA_MODEL=
OLLAMA_NUM_CTX=8192
OLLAMA_TIMEOUT_MS=15000
OLLAMA_TEMPERATURE=0.8
OLLAMA_TOP_P=0.95
OLLAMA_TOP_K=64

COORDINATOR_WORKERS=2
QUEUE_MAX_SIZE=200
PLAYER_COOLDOWN_SECONDS=5
MAX_TEXT_CHARS=500
MAX_CORRECTION_ATTEMPTS=5
CONTEXT_RESERVED_TOKENS=1536

PRIORITY_RAIDBOSS=100
PRIORITY_PLAYER=90
PRIORITY_CRAFT=90
PRIORITY_NPC=80
PRIORITY_EVENT=70
PRIORITY_BACKGROUND=30
PRIORITY_WORLD=10

# Betreiber-Ergänzungen zu den Sprachfilterdateien (§9/10):
INPUT_DENY_WORDS=
OUTPUT_DENY_WORDS=
ALLOWED_ACTION_KEYS=intent,target,scope,confidence

# Registrierte Realms (mindestens eines) — REALM_<name>_ID + SERVICE_<name>_*:
#SERVICE_DE1_ID=realm-de1-service
#SERVICE_DE1_SECRET=CHANGE_ME
#SERVICE_DE1_PERMISSIONS=coordinator.jobs.submit,coordinator.jobs.query
#REALM_DE1_ID=de1
# Push-Ergebnis-Callback: Deployment-Platzhalter; die tatsächliche Adresse
# legt der Betreiber je Realm fest (unabhängig von Ports alter Node-Realms).
#REALM_DE1_RESULT_URL=https://realm-de1.example.invalid/v1/coordinator/result

# Koordinator-Identität für signierte Ergebnis-Callbacks (nur bei RESULT_URL):
#COORDINATOR_SERVICE_ID=coordinator-service
#COORDINATOR_SERVICE_SECRET=CHANGE_ME

RATE_LIMIT_BURST=10
RATE_LIMIT_PER_MIN=120

# Optional TLS:
#TLS_CERT_FILE=
#TLS_KEY_FILE=