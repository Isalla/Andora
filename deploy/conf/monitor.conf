# monitor.conf — EnvironmentFile des andora-monitor-fpm.service (PHP-Panel)
# Alle Pfade sind Produktionsplatzhalter; auf dem Zielserver an die echten
# Deployment-Orte anpassen (siehe deploy/README.md).
# Der FPM-Pool nutzt clear_env=no, damit diese Variablen bis ins PHP-Skript
# (getenv) durchsickern.
# Bind-Interfaces des Panels: ""/auto = nur 127.0.0.1 (Standard), ipv4/4 =
# alle IPv4 (0.0.0.0), ipv6/6 = nur IPv6, dual/both = dual-stack, sonst
# IP-Literal oder Hostname.
ANDORA_MONITOR_BIND=127.0.0.1
ANDORA_MONITOR_PORT=3003
# Leer lassen = kein Token; setzen = token-geschützes Panel (Admin-Zugriff).
ANDORA_MONITOR_TOKEN=
# Zielpfad des laufenden Gameservers-Status (Health-/Status-Port des Servers).
# IPv6-Host darf ungeklammert als host:port angegeben werden (wird zu [host]:port).
ANDORA_GAME_SERVER_URL=http://127.0.0.1:3002
# Name der Game-Server-Unit, die das Panel steuern darf.
ANDORA_SERVICE_NAME=andora-server.service
# Der User, dem die sudo-Regel für Start/Stop/Restart eingeräumt wird.
ANDORA_SUDO_USER=pi
# Name der sudoers-Rule-Datei unter /etc/sudoers.d (nur dieser Pfad zählt).
ANDORA_SUDO_UNIT=andora-monitor
# Zielpfad der editierbaren Server-Konfiguration (GET/POST /api/config).
# Der Code leitet ihn aus dem Panel-Verzeichnis ab und landet sonst im
# Dev-Repo-Root; in Produktion daher zwingend auf die Server-config.env setzen.
ANDORA_SERVER_CONFIG=/opt/andora/server/config.env
