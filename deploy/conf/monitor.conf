# monitor.conf — EnvironmentFile des andora-monitor.service
# Alle Pfade sind Produktionsplatzhalter; auf dem Zielserver an die echten
# Deployment-Orte anpassen (siehe deploy/README.md).
ANDORA_MONITOR_BIND=127.0.0.1
ANDORA_MONITOR_PORT=3003
# Leer lassen = kein Token; setzen = token-geschützes Panel (Admin-Zugriff).
ANDORA_MONITOR_TOKEN=
# Zielpfad des laufenden Gameservers-Status (Health-/Status-Port des Servers).
ANDORA_GAME_SERVER_URL=http://127.0.0.1:3002
# Name der Game-Server-Unit, die das Panel steuern darf.
ANDORA_SERVICE_NAME=andora-server.service
# Der User, dem die sudo-Regel für Start/Stop/Restart eingeräumt wird.
ANDORA_SUDO_USER=pi
# Name der sudoers-Rule-Datei unter /etc/sudoers.d (nur dieser Pfad zählt).
ANDORA_SUDO_UNIT=andora-monitor
