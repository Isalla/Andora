; monitor-fpm.conf — PHP-FPM-Master-Konfiguration für das Monitoring/Panel
;
; Einzige FPM-Instance für das Panel; läuft als eigener nicht-root-Benutzer.
; Wird von andora-monitor-fpm.service via --fpm-config geladen.
; Dies ist eine Vorlage — Pfade/User auf den Zielserver anpassen.
;
; Batch: php-fpm8.2 --nodaemonize --fpm-config /opt/andora/monitor/monitor-fpm.conf

[global]
; Muss zu User/Group in andora-monitor-fpm.service passen.
user = pi
group = pi
; Pid-Datei (RuntimeDirectory=andora-monitor legt /run/andora-monitor an).
pid = /run/andora-monitor/php-fpm.pid
error_log = /var/log/andora-monitor/php-fpm.log
log_level = notice
; Kein Daemonize — systemd Type=simple erwartet den Prozess im Vordergrund.
daemonize = no

; Pool: ein Pool pro Panel; unix-socket, da Apache auf demselben Host läuft.
[andora-monitor]
user = pi
group = pi
listen = /run/andora-monitor/php-fpm.sock
listen.owner = pi
listen.group = pi
listen.mode = 0660
pm = dynamic
pm.max_children = 5
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Nur das Panel-Dokumentenverzeichnis; alles andere verweigert.
chdir = /opt/andora/monitor
php_admin_value[open_basedir] = /opt/andora/monitor
php_admin_flag[log_errors] = on
; Zugriff auf env: Panel-Config liest ANDORA_* Variablen.
; clear_env = no, damit die ANDORA_* Variablen aus dem EnvironmentFile
; der Unit (deploy/conf/monitor.conf) bis in getenv() durchsickern.
clear_env = no
