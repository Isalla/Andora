# andora-monitor-site.conf — Apache-Vhost der Panel-Instance inkl. Bindung
#
# Hier wird die Bind-Host-/Dual-Stack-Semantik aus config.php / listen_plans()
# (ANDORA_MONITOR_BIND) in explizite Apache-Listen-Direktiven übersetzt.
#
# Regel (Netz standard 4b53e36): Dual-Stack = ZWEI explizite Listener
# (IPv4 0.0.0.0 + IPv6 [::]). Es wird NICHT auf implizite
# IPv4-mapped-IPv6-Sockets vertraut (plattformabhängig); auf Linux setzt
# Apache IPV6_V6ONLY selbst auf dem [::]-Socket.
#
# Apache 2.4: NameVirtualHost ist obsolet; <VirtualHost *:3003> matcht alle
# auf Port 3003 gebundenen Addressen.

# --- Bind-Modus wählen: GENAU EINEN Block aktivieren, die anderen einkommentieren ---

# [1] auto / 127.0.0.1 (Standard — nur Loopback, weder LAN noch public)
Listen 127.0.0.1:3003

# [2] ipv4 / 4 — alle IPv4-Interfaces
#Listen 0.0.0.0:3003

# [3] ipv6 / 6 — nur IPv6 (kein IPv4-mapped)
#Listen [::]:3003

# [4] dual / both — dual-stack: ZWEI explizite Listener
#Listen 0.0.0.0:3003
#Listen [::]:3003


<VirtualHost *:3003>
    ServerName localhost

    # Panel-Root: public-Verzeichnis ist das Dokumenten-Root (nur index.php + index.html).
    DocumentRoot /opt/andora/monitor/public
    <Directory /opt/andora/monitor/public>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
    </Directory>

    # Alles an den PHP-FPM-Pool weiterleiten (fastcgi via unix socket).
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/andora-monitor/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Front-Controller: unbekannte Pfade an index.php (verwirft per switch -> 404 JSON).
    DirectoryIndex index.php index.html
    # Fallback auf den Front-Controller für /api/*-Pfade.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.php [L]

    # X-API-Token wird als Header ausgewertet (case-insensitive in PHP).
    # Token selbst steht in monitor.conf / Umgebung, nicht hier.
</VirtualHost>
