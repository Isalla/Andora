# agent.conf — EnvironmentFile / Konfigurationsvorbild des
# andora-agent.service (Deployment). Werte auf den Zielserver anpassen;
# die kommentierte Stichwortliste deckt sich mit
# src/agent/config.env.example.
#
# Details: docs/Deployment_Betriebsarchitektur.md, src/agent/README.md.
# Probe vor Ort:
#   curl -s http://127.0.0.1:9443/health
#   curl -s -H 'X-Andora-Token: <token>' http://127.0.0.1:9443/api/v1/services

# Dedizierter Management-Port (getrennt von 3001/3002/3003/8080/8081/8082/11434).
AGENT_PORT=9443
# "" | auto   alle Interfaces (Standard)
# ipv4 | 4    nur IPv4 (0.0.0.0)
# ipv6 | 6    nur IPv6 ([::])
# dual | both dual-stack (0.0.0.0 + [::])
# IP-Literal oder Hostname (auch IPv6)
AGENT_BIND_HOST=127.0.0.1

# Shared Secret für Management-Requests (Pflicht, fail-closed bei leerem Wert).
AGENT_TOKEN=CHANGE_ME

# Verwaltete Dienste (Komma-getrennte Keys; pro Key siehe unten).
AGENT_SERVICES=realm,coordinator

# Realm (Rust-Realm, andora-realm.service):
AGENT_SERVICE_REALM_UNIT=andora-realm.service
AGENT_SERVICE_REALM_URL=http://127.0.0.1:3002
AGENT_SERVICE_REALM_HEALTH_PATH=/health

# Coordinator (andora-coordinator.service):
AGENT_SERVICE_COORDINATOR_UNIT=andora-coordinator.service
AGENT_SERVICE_COORDINATOR_URL=http://127.0.0.1:8082
AGENT_SERVICE_COORDINATOR_HEALTH_PATH=/health

# Optional: Monitoring-Panels (nur Status, keine Health-URL nötig):
#AGENT_SERVICE_MONITOR_UNIT=andora-monitor-fpm.service

AGENT_SYSTEMCTL=/usr/bin/systemctl
AGENT_JOURNALCTL=/usr/bin/journalctl
AGENT_SUDO=/usr/bin/sudo
AGENT_SUDO_ENABLED=true

AGENT_LOG_LINE_LIMIT=200
AGENT_LOG_BYTE_LIMIT=131072
AGENT_PROBE_TIMEOUT_MS=1500

# Optional Server-TLS (Zertifikatsdateien). mTLS-Vorbereitung:
# alle drei mTLS-Keys UND Server-TLS sind Pflicht, sonst Start-Verweigerung
# (keine stille Abschwächung auf Plain-HTTP).
#TLS_CERT_FILE=
#TLS_KEY_FILE=
#AGENT_CA_FILE=
#AGENT_CLIENT_CERT_FILE=
#AGENT_CLIENT_KEY_FILE=