[package]
name = "andora-realm"
version = "0.1.0"
edition = "2021"
description = "Andora Realm-Server (Rust) — Spiel-Autorität eines Realms: Dogs/Combat/Chat/NPC via WS-Protokoll, Persistenz in realm_state_<realm>"
license = "MIT"

[[bin]]
name = "andora-realm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
